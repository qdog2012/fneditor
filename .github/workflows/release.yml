name: Release

on:
  push:
    tags:
      - "0.1.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Check release version
        run: |
          test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          test "$(sed -n 's/^version=//p' packaging/fpk-native/manifest)" = "$GITHUB_REF_NAME"
      - name: Test Go backend
        run: |
          go test -race ./server
          go vet ./server
      - name: Build Linux amd64 FPK
        env:
          TARGET_ARCH: amd64
        run: |
          bash scripts/prepare-fpk-native.sh
          bash scripts/package-fpk-native.sh
          cd build/fpk-output
          sha256sum "fneditor-${GITHUB_REF_NAME}.fpk" > SHA256SUMS
      - name: Test frontend API responses
        run: npm run test:frontend
      - name: Smoke test packaged service
        run: |
          app_dir="$PWD/build/fpk-native/fncode/app/server"
          data_dir="$(mktemp -d)"
          mkdir -p "$data_dir/files"
          FNEDITOR_APP_DIR="$app_dir" FNEDITOR_ROOT="$data_dir/files" FNEDITOR_RESTRICT_ROOTS=1 \
            FNEDITOR_STATE_PATH="$data_dir/state.json" "$app_dir/fneditor" > "$data_dir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:39280/api/meta > "$data_dir/meta.json"; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != 1 ]; then cat "$data_dir/server.log"; exit 1; fi
          node -e 'const fs=require("fs"); const meta=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (meta.version !== process.env.GITHUB_REF_NAME) process.exit(1);' "$data_dir/meta.json"
          curl --fail --silent http://127.0.0.1:39280/ | grep -q '<html'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "build/fpk-output/fneditor-${GITHUB_REF_NAME}.fpk" \
            build/fpk-output/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
